<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SG Travel Tool - 新加坡之旅</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#70aca7',
                        secondary: '#daefeb',
                        accent: '#ffca05',
                        danger: '#f0603c',
                        bglight: '#f8fbfb'
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Noto Sans TC', sans-serif; background-color: #f8fbfb; }
        .glass-card { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); border: 1px solid rgba(112, 172, 167, 0.1); }
        .active-tab { color: #70aca7; border-bottom: 3px solid #70aca7; }
        .bottom-nav-active { color: #70aca7; }
        .day-btn-active { background-color: #70aca7; color: white; }
        /* 隱藏滾動條 */
        ::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        /* 重要時間標示 */
        .important-time { color: #f0603c; font-weight: bold; }
    </style>
</head>
<body class="pb-20">

    <header class="bg-primary text-white p-6 rounded-b-[40px] shadow-lg sticky top-0 z-50">
        <div class="flex justify-between items-center mb-4">
            <h1 class="text-2xl font-bold tracking-wider">SG 2026 探險</h1>
            <div id="weather-icon" class="text-xl"><i class="fas fa-sun"></i></div>
        </div>
        <div id="day-selector" class="flex gap-2 overflow-x-auto no-scrollbar pb-2">
            </div>
    </header>

    <main id="main-content" class="p-4">
        </main>

    <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-100 flex justify-around items-center py-3 shadow-[0_-5px_15px_rgba(0,0,0,0.05)] z-50">
        <button onclick="changeModule('PLAN')" class="nav-btn flex flex-col items-center gap-1 text-gray-400" id="nav-PLAN">
            <i class="fas fa-calendar-day text-xl"></i>
            <span class="text-[10px] font-bold">PLAN</span>
        </button>
        <button onclick="changeModule('GUIDE')" class="nav-btn flex flex-col items-center gap-1 text-gray-400" id="nav-GUIDE">
            <i class="fas fa-map-marked-alt text-xl"></i>
            <span class="text-[10px] font-bold">GUIDE</span>
        </button>
        <button onclick="changeModule('WALLET')" class="nav-btn flex flex-col items-center gap-1 text-gray-400" id="nav-WALLET">
            <i class="fas fa-wallet text-xl"></i>
            <span class="text-[10px] font-bold">WALLET</span>
        </button>
        <button onclick="changeModule('LISTS')" class="nav-btn flex flex-col items-center gap-1 text-gray-400" id="nav-LISTS">
            <i class="fas fa-clipboard-list text-xl"></i>
            <span class="text-[10px] font-bold">LISTS</span>
        </button>
        <button onclick="changeModule('INFO')" class="nav-btn flex flex-col items-center gap-1 text-gray-400" id="nav-INFO">
            <i class="fas fa-info-circle text-xl"></i>
            <span class="text-[10px] font-bold">INFO</span>
        </button>
    </nav>

    <script>
        // --- 1. Data Store ---
        const ITINERARY = [
            { day: 1, date: "1/29 (四)", title: "抵達獅城：深夜安置", events: [
                { time: "16:15", act: "酷行 TR899 出發", desc: "16:15～20:55", type: "transport", important: true },
                { time: "22:15", act: "交通：地鐵棕線 (TEL)", desc: "Changi Airport → Havelock (TE16) (約 50 分鐘)", type: "transport" },
                { time: "23:00", act: "辦理入住", desc: "Furama RiverFront (405 Havelock Rd)", type: "stay" },
                { time: "深夜", act: "深夜採買：羅伯遜碼頭", desc: "7-Eleven 或 Cheers (步行 5-8 分)", type: "food" }
            ]},
            { day: 2, date: "1/30 (五)", title: "聖淘沙：魔法大冒險", events: [
                { time: "08:30", act: "早餐：中峇魯市場", desc: "推薦：楗柏水粿、中峇魯滷麵。飯店搭 123 公車 3 站即達。", type: "food", gmaps: "Tiong Bahru Market" },
                { time: "11:00", act: "哈利波特：魔法幻象", desc: "預約制景點", type: "sight" },
                { time: "15:00", act: "斜坡滑車 (Skyline Luge)", desc: "預定玩 4 趟", type: "sight", important: true },
                { time: "19:00", act: "晚餐：VivoCity 美食閣", desc: "Food Republic 內容豐富", type: "food" },
                { time: "20:00", act: "回程：地鐵紫線轉棕線", desc: "港灣站 → 歐南園轉乘 → Havelock 站", type: "transport" }
            ]},
            { day: 3, date: "1/31 (六)", title: "萬態園區：飛禽與文化", events: [
                { time: "09:00", act: "飛禽公園 (Bird Paradise)", desc: "準時入場。10:30 有 Predators on Wings 表演。", type: "sight", important: true },
                { time: "16:30", act: "小印度 & 小阿拉伯", desc: "異國風情街區散步", type: "sight", gmaps: "Little India Singapore" },
                { time: "18:30", act: "晚餐：Zam Zam 印度煎餅", desc: "經典老店", type: "food", gmaps: "Singapore Zam Zam" }
            ]},
            { day: 4, date: "2/1 (日)", title: "城市經典：藝術美學", events: [
                { time: "10:00", act: "新加坡國家博物館", desc: "公車 143/197/51 於 Aft Bras Basah 站下車", type: "sight" },
                { time: "15:00", act: "新加坡國家美術館", desc: "停留 2 小時", type: "sight" },
                { time: "19:45", act: "天空樹燈光秀", desc: "Supertree Grove 表演", type: "sight", important: true },
                { time: "21:00", act: "金沙酒店水舞秀", desc: "從天空樹步行 15 分鐘過橋即達", type: "sight" }
            ]},
            { day: 5, date: "2/2 (一)", title: "萬態園區：動物探險", events: [
                { time: "08:30", act: "新加坡動物園", desc: "10:30 海洋動物表演", type: "sight" },
                { time: "18:00", act: "晚餐：Ulu Ulu Safari", desc: "南洋料理自助", type: "food" },
                { time: "19:15", act: "夜間野生動物園", desc: "晚上 7:30 表演需提前 2hr 預約", type: "sight", important: true }
            ]},
            { day: 6, date: "2/3 (二)", title: "亞洲雨林與肉骨茶", events: [
                { time: "09:00", act: "亞洲雨林探險園", desc: "準時抵達", type: "sight" },
                { time: "12:30", act: "午餐：Cavern Restaurant", desc: "洞穴沉浸式餐廳", type: "food" },
                { time: "18:30", act: "晚餐：松發肉骨茶", desc: "克拉碼頭總店，建議 18:00 前抵達", type: "food", important: true }
            ]},
            { day: 7, date: "2/4 (三)", title: "星耀樟宜：完美收尾", events: [
                { time: "10:00", act: "星耀樟宜：雨漩渦", desc: "觀賞壯觀室內瀑布", type: "sight" },
                { time: "11:00", act: "機場免稅店最後採購", desc: "小CK、斑蘭蛋糕、百勝廚叻沙", type: "shop" },
                { time: "12:30", act: "航班回程：酷行 TR 896", desc: "準備返航", type: "transport", important: true }
            ]}
        ];

        const GUIDE_DATA = [
            { name: "中峇魯", desc: "新加坡最古老的住宅區之一，建築充滿藝術氣息。除了知名的市場美食，還有許多獨立書店與精品咖啡店。", lat: 1.284, lng: 103.832 },
            { name: "聖淘沙", desc: "名副其實的「歡樂島」。哈利波特魔法幻象是近期亮點，斜坡滑車則是腎上腺素飆升的首選。", lat: 1.249, lng: 103.830 },
            { name: "飛禽公園", desc: "亞洲最大鳥類天堂。世界之翼與飛翔掠食者表演是必看節目，記得下載 Mandai App 追蹤最新表演時間。", lat: 1.403, lng: 103.783 },
            { name: "克拉碼頭", desc: "昔日貿易樞紐，今日夜生活中心。松發肉骨茶總店就在此處，享受胡椒味濃郁的美味湯底。", lat: 1.290, lng: 103.846 }
        ];

        // --- 2. State Management ---
        let currentDay = 1;
        let activeModule = 'PLAN';

        // --- 3. Core Functions ---
        function init() {
            renderDaySelector();
            changeModule('PLAN');
            loadChecklist();
            loadNotes();
            loadExpenses();
        }

        function renderDaySelector() {
            const selector = document.getElementById('day-selector');
            selector.innerHTML = ITINERARY.map(d => `
                <button onclick="setDay(${d.day})" id="day-btn-${d.day}" 
                    class="day-btn flex-shrink-0 px-5 py-2 rounded-full text-sm font-bold bg-secondary/50 text-primary transition-all">
                    D${d.day}
                </button>
            `).join('');
            updateDayButtonUI();
        }

        function setDay(day) {
            currentDay = day;
            updateDayButtonUI();
            if (activeModule === 'PLAN') renderPlan();
        }

        function updateDayButtonUI() {
            document.querySelectorAll('.day-btn').forEach(btn => btn.classList.remove('day-btn-active'));
            const activeBtn = document.getElementById(`day-btn-${currentDay}`);
            if (activeBtn) activeBtn.classList.add('day-btn-active');
        }

        function changeModule(mod) {
            activeModule = mod;
            document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('bottom-nav-active'));
            document.getElementById(`nav-${mod}`).classList.add('bottom-nav-active');
            
            // 只有在 PLAN 分頁顯示天數切換
            document.getElementById('day-selector').style.display = (mod === 'PLAN') ? 'flex' : 'none';

            renderModule();
        }

        function renderModule() {
            const main = document.getElementById('main-content');
            main.innerHTML = '';

            switch(activeModule) {
                case 'PLAN': renderPlan(); break;
                case 'GUIDE': renderGuide(); break;
                case 'WALLET': renderWallet(); break;
                case 'LISTS': renderLists(); break;
                case 'INFO': renderInfo(); break;
            }
        }

        // --- 4. Render Modules ---

        function renderPlan() {
            const dayData = ITINERARY.find(d => d.day === currentDay);
            let html = `<h2 class="text-xl font-bold text-primary mb-4">${dayData.date} | ${dayData.title}</h2>`;
            
            dayData.events.forEach(ev => {
                html += `
                <div class="glass-card mb-4 p-4 rounded-3xl shadow-sm border-l-4 ${ev.important ? 'border-danger' : 'border-primary'}">
                    <div class="flex justify-between items-start mb-2">
                        <span class="text-sm ${ev.important ? 'important-time' : 'text-primary'} font-bold">
                            <i class="far fa-clock mr-1"></i> ${ev.time}
                        </span>
                        ${ev.gmaps ? `<a href="https://www.google.com/maps/search/${encodeURIComponent(ev.gmaps)}" target="_blank" class="text-xs text-blue-500 font-bold underline"><i class="fas fa-map-marker-alt"></i> 地圖</a>` : ''}
                    </div>
                    <h3 class="font-bold text-gray-800">${ev.act}</h3>
                    <p class="text-sm text-gray-500 mt-1">${ev.desc}</p>
                </div>
                `;
            });
            document.getElementById('main-content').innerHTML = html;
        }

        function renderGuide() {
            let html = `<h2 class="text-2xl font-bold text-primary mb-6">重點景點導覽</h2>`;
            GUIDE_DATA.forEach((g, idx) => {
                html += `
                <div class="mb-6">
                    <details class="glass-card rounded-3xl overflow-hidden shadow-sm" ${idx===0?'open':''}>
                        <summary class="p-4 font-bold text-gray-700 cursor-pointer list-none flex justify-between items-center bg-secondary/30">
                            ${g.name} <i class="fas fa-chevron-down text-xs"></i>
                        </summary>
                        <div class="p-4 text-sm text-gray-600 leading-relaxed">
                            <p class="mb-4">${g.desc}</p>
                            <iframe width="100%" height="200" class="rounded-2xl" frameborder="0" scrolling="no" 
                                src="https://www.openstreetmap.org/export/embed.html?bbox=${g.lng-0.01},${g.lat-0.01},${g.lng+0.01},${g.lat+0.01}&layer=mapnik&marker=${g.lat},${g.lng}">
                            </iframe>
                        </div>
                    </details>
                </div>
                `;
            });
            document.getElementById('main-content').innerHTML = html;
        }

        function renderWallet() {
            const main = document.getElementById('main-content');
            main.innerHTML = `
                <div class="bg-primary/10 p-6 rounded-[30px] mb-6">
                    <h3 class="font-bold text-primary mb-4"><i class="fas fa-calculator mr-2"></i>即時匯率換算 (1 SGD : 24 TWD)</h3>
                    <div class="flex gap-4 items-center">
                        <div class="flex-1">
                            <label class="text-[10px] font-bold text-gray-400">新加坡幣 SGD</label>
                            <input type="number" id="sgd-input" oninput="convertPrice('sgd')" class="w-full p-2 rounded-xl border-none outline-none font-bold text-lg" value="1">
                        </div>
                        <i class="fas fa-exchange-alt text-primary mt-4"></i>
                        <div class="flex-1">
                            <label class="text-[10px] font-bold text-gray-400">新台幣 TWD</label>
                            <input type="number" id="twd-input" oninput="convertPrice('twd')" class="w-full p-2 rounded-xl border-none outline-none font-bold text-lg" value="24">
                        </div>
                    </div>
                </div>

                <div class="glass-card p-6 rounded-[30px] shadow-sm mb-6">
                    <h3 class="font-bold text-gray-700 mb-4">新增開支</h3>
                    <input type="text" id="exp-name" placeholder="品項 (如: 海南雞飯)" class="w-full mb-3 p-3 bg-gray-50 rounded-xl outline-none text-sm">
                    <div class="flex gap-2 mb-3">
                        <input type="number" id="exp-amt" placeholder="SGD 金額" class="flex-1 p-3 bg-gray-50 rounded-xl outline-none text-sm font-bold">
                        <label class="bg-secondary p-3 rounded-xl cursor-pointer">
                            <i class="fas fa-camera text-primary"></i>
                            <input type="file" id="exp-img" class="hidden" accept="image/*" onchange="handleImage(this)">
                        </label>
                    </div>
                    <button onclick="saveExpense()" class="w-full bg-primary text-white font-bold py-3 rounded-xl shadow-md active:scale-95 transition">儲存帳目</button>
                </div>
                <div id="expense-list" class="space-y-3"></div>
            `;
            loadExpenses();
        }

        function convertPrice(source) {
            const rate = 24;
            const sgd = document.getElementById('sgd-input');
            const twd = document.getElementById('twd-input');
            if(source === 'sgd') twd.value = (sgd.value * rate).toFixed(0);
            else sgd.value = (twd.value / rate).toFixed(2);
        }

        let tempBase64 = "";
        function handleImage(input) {
            const file = input.files[0];
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    const maxW = 300;
                    const scale = maxW / img.width;
                    canvas.width = maxW;
                    canvas.height = img.height * scale;
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    tempBase64 = canvas.toDataURL('image/jpeg', 0.6);
                    alert("照片已選取並壓縮！");
                }
                img.src = e.target.result;
            }
            reader.readAsDataURL(file);
        }

        function saveExpense() {
            const name = document.getElementById('exp-name').value;
            const amt = document.getElementById('exp-amt').value;
            if(!name || !amt) return alert("請輸入完整名稱與金額");
            
            const list = JSON.parse(localStorage.getItem('sg_expenses') || "[]");
            list.unshift({ name, amt, img: tempBase64, id: Date.now() });
            localStorage.setItem('sg_expenses', JSON.stringify(list));
            tempBase64 = "";
            renderWallet();
        }

        function loadExpenses() {
            const listEl = document.getElementById('expense-list');
            if(!listEl) return;
            const list = JSON.parse(localStorage.getItem('sg_expenses') || "[]");
            listEl.innerHTML = list.map(ex => `
                <div class="flex items-center gap-4 p-3 bg-white rounded-2xl shadow-sm">
                    ${ex.img ? `<img src="${ex.img}" class="w-12 h-12 rounded-lg object-cover">` : '<div class="w-12 h-12 bg-gray-100 rounded-lg flex items-center justify-center text-xs text-gray-300">N/A</div>'}
                    <div class="flex-1">
                        <div class="text-sm font-bold text-gray-700">${ex.name}</div>
                        <div class="text-xs text-gray-400">SGD ${ex.amt} (約 NT$ ${Math.round(ex.amt*24)})</div>
                    </div>
                    <button onclick="deleteExpense(${ex.id})" class="text-gray-300"><i class="fas fa-times"></i></button>
                </div>
            `).join('');
        }

        function deleteExpense(id) {
            let list = JSON.parse(localStorage.getItem('sg_expenses') || "[]");
            list = list.filter(item => item.id !== id);
            localStorage.setItem('sg_expenses', JSON.stringify(list));
            loadExpenses();
        }

        function renderLists() {
            document.getElementById('main-content').innerHTML = `
                <h2 class="text-2xl font-bold text-primary mb-6">備忘清單</h2>
                <div class="glass-card p-6 rounded-[30px] mb-8">
                    <h3 class="font-bold text-gray-700 mb-4">行前準備</h3>
                    <div id="checklist-area" class="space-y-4">
                        ${['護照', '網卡', '雨衣', '行動電源', '充電器'].map((item, i) => `
                            <label class="flex items-center gap-3 cursor-pointer group">
                                <input type="checkbox" class="w-5 h-5 accent-primary rounded cursor-pointer" id="chk-${i}" onchange="saveChecklist()">
                                <span class="text-gray-600 group-hover:text-primary transition font-medium">${item}</span>
                            </label>
                        `).join('')}
                    </div>
                </div>

                <div class="glass-card p-6 rounded-[30px]">
                    <h3 class="font-bold text-gray-700 mb-4">隨手筆記</h3>
                    <textarea id="note-text" oninput="saveNotes()" class="w-full h-40 p-4 bg-gray-50 rounded-2xl border-none outline-none text-sm leading-relaxed" placeholder="輸入內容，網址會自動轉為按鈕..."></textarea>
                    <div id="link-preview" class="mt-4 flex flex-wrap gap-2"></div>
                </div>
            `;
            loadChecklist();
            loadNotes();
        }

        function saveChecklist() {
            const data = {};
            document.querySelectorAll('#checklist-area input').forEach(chk => {
                data[chk.id] = chk.checked;
            });
            localStorage.setItem('sg_checklist', JSON.stringify(data));
        }

        function loadChecklist() {
            const data = JSON.parse(localStorage.getItem('sg_checklist') || "{}");
            Object.keys(data).forEach(id => {
                const el = document.getElementById(id);
                if(el) el.checked = data[id];
            });
        }

        function saveNotes() {
            const txt = document.getElementById('note-text').value;
            localStorage.setItem('sg_notes', txt);
            parseLinks(txt);
        }

        function loadNotes() {
            const txt = localStorage.getItem('sg_notes') || "";
            const el = document.getElementById('note-text');
            if(el) {
                el.value = txt;
                parseLinks(txt);
            }
        }

        function parseLinks(text) {
            const preview = document.getElementById('link-preview');
            if(!preview) return;
            const urlRegex = /(https?:\/\/[^\s]+)/g;
            const matches = text.match(urlRegex);
            preview.innerHTML = matches ? matches.map(url => `
                <a href="${url}" target="_blank" class="bg-secondary text-primary px-3 py-1 rounded-full text-xs font-bold shadow-sm">
                    <i class="fas fa-external-link-alt mr-1"></i> 前往連結
                </a>
            `).join('') : '';
        }

        function renderInfo() {
            document.getElementById('main-content').innerHTML = `
                <div class="grid grid-cols-2 gap-4 mb-6">
                    <a href="https://www.weather.gov.sg/home/" target="_blank" class="bg-blue-50 p-4 rounded-3xl flex flex-col items-center shadow-sm">
                        <i class="fas fa-cloud-sun text-blue-400 text-3xl mb-2"></i>
                        <span class="text-xs font-bold text-blue-600">當地天氣</span>
                    </a>
                    <div class="bg-red-50 p-4 rounded-3xl flex flex-col items-center shadow-sm" onclick="alert('報警: 999\\n救護車: 995')">
                        <i class="fas fa-phone-alt text-red-400 text-3xl mb-2"></i>
                        <span class="text-xs font-bold text-red-600">緊急聯絡</span>
                    </div>
                </div>

                <div class="bg-accent/10 p-6 rounded-[30px] border-l-4 border-accent mb-6">
                    <h3 class="font-bold text-gray-700 mb-3"><i class="fas fa-umbrella mr-2"></i>雨天備案 (RAIN)</h3>
                    <ul class="text-xs text-gray-600 space-y-2 leading-relaxed">
                        <li>• <b>聖淘沙：</b>改往 S.E.A. 海洋館或杜莎夫人蠟像館。</li>
                        <li>• <b>萬態園區：</b>改往濱海灣溫室 (Cloud Forest) 或 Suntec City 逛街。</li>
                        <li>• <b>替代方案：</b>Funan Digital Mall。觀察智慧零售與室內單車徑，非常適合老師與研究生背景。</li>
                    </ul>
                </div>

                <div class="glass-card p-6 rounded-[30px] shadow-sm">
                    <h3 class="font-bold text-gray-700 mb-3"><i class="fas fa-exclamation-triangle mr-2 text-primary"></i>旅遊禁忌與提醒</h3>
                    <ul class="text-xs text-gray-600 space-y-2 leading-relaxed">
